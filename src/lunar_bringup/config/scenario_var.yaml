# 变规模/动态重规划场景：资源池 8 个，每回合随机采样 3~6 个；资源耗尽后动态重生新资源。

world:
  file: "lunar_field.world"

robots:
  scout:
    xacro: "scout.urdf.xacro"
    entity: "scout"
    namespace: "scout"
    x: 0.0
    y: 0.0
    z: 0.34
    yaw: 0.0
    controllers_yaml: "scout_controllers.yaml"
    controllers: ["joint_state_broadcaster", "legs_controller"]
    extra_nodes: ["scout_gait"]
    cmd_vel_topic: "/scout/cmd_vel"
    role: "SCOUT"
  excavator:
    xacro: "excavator.urdf.xacro"
    entity: "excavator"
    namespace: "excavator"
    x: 0.8
    y: 0.5
    z: 0.12
    yaw: 0.0
    controllers_yaml: "excavator_controllers.yaml"
    controllers: ["joint_state_broadcaster", "drive_controller", "arm_controller"]
    cmd_vel_topic: "/excavator/drive_controller/cmd_vel_unstamped"
    role: "EXCAVATOR"
  hauler:
    xacro: "hauler.urdf.xacro"
    entity: "hauler"
    namespace: "hauler"
    x: -0.8
    y: -0.5
    z: 0.12
    yaw: 0.0
    controllers_yaml: "hauler_controllers.yaml"
    controllers: ["joint_state_broadcaster", "drive_controller", "dump_controller"]
    cmd_vel_topic: "/hauler/drive_controller/cmd_vel_unstamped"
    role: "HAULER"

resources:
  - {id: 0, x: 2.0, y: 1.5, amount: 20.0, value: 1.0}
  - {id: 1, x: -2.5, y: 2.0, amount: 15.0, value: 1.0}
  - {id: 2, x: 1.5, y: -2.5, amount: 25.0, value: 1.0}
  - {id: 3, x: 3.0, y: -1.0, amount: 18.0, value: 1.0}
  - {id: 4, x: -3.0, y: -1.5, amount: 22.0, value: 1.0}
  - {id: 5, x: 0.5, y: 3.0, amount: 12.0, value: 1.0}
  - {id: 6, x: -1.0, y: -3.0, amount: 16.0, value: 1.0}
  - {id: 7, x: 3.5, y: 1.0, amount: 20.0, value: 1.0}

depot:
  x: -2.0
  y: -1.5

episode:
  max_time_s: 120.0
  control_horizon_s: 0.5
  sim_time_step_s: 0.01
  dig_radius: 0.6
  load_radius: 0.7
  dump_radius: 0.7
  bucket_capacity: 4.0
  bin_capacity: 10.0
  dig_rate_per_s: 2.0
  # 变规模/动态重规划
  variable_resources: true
  min_resources: 3
  max_resources: 6
  dynamic_respawn: true
  respawn_threshold: 10.0
