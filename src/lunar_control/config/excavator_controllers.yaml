/**/controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    drive_controller:
      type: diff_drive_controller/DiffDriveController

    arm_controller:
      type: position_controllers/JointGroupPositionController

/**/drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    wheel_separation: 0.38
    wheel_radius: 0.08
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    open_loop: false
    enable_odom_tf: true
    cmd_vel_timeout: 0.5
    use_stamped_vel: false
    # 平滑 cmd_vel 阶跃，防止瞬时加速/转向导致倾倒
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.4
    linear.x.min_velocity: -0.4
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 0.6
    linear.x.min_acceleration: -0.6
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 0.8
    angular.z.min_velocity: -0.8
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 1.2
    angular.z.min_acceleration: -1.2

/**/arm_controller:
  ros__parameters:
    joints:
      - shoulder_pitch_joint
      - elbow_pitch_joint
      - wrist_pitch_joint
